user nginx;
worker_processes 1;

error_log /dev/stderr info;
pid /tmp/nginx.pid;

load_module modules/ndk_http_module.so;
load_module modules/ngx_http_echo_module.so;
load_module modules/ngx_http_headers_more_filter_module.so;
load_module modules/ngx_http_memc_module.so;
load_module modules/ngx_http_redis2_module.so;
load_module modules/ngx_http_redis_module.so;
load_module modules/ngx_http_set_misc_module.so;
load_module modules/ngx_http_srcache_filter_module.so;
load_module modules/ngx_http_subs_filter_module.so;
load_module modules/ngx_postgres_module.so;
load_module modules/ngx_http_rds_json_filter_module.so;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type text/plain;
    access_log /dev/stdout;
    server_tokens off;

    upstream backend {
        server backend:3000;
    }

    upstream memc {
        server memcached:11211;
    }

    upstream redis {
        server redis:6379;
    }

    upstream pg {
        postgres_server postgres:5432 dbname=test user=test password=test;
    }

    server {
        listen 8000;

        location = /health {
            return 200 "ok\n";
        }

        location = /echo {
            echo "echo $arg_x";
        }

        location = /headers {
            more_set_headers "X-Test: yes";
            more_clear_headers "Server";
            return 200 "headers\n";
        }

        location = /setmisc {
            set_sha1 $sha $arg_x;
            set_md5 $md5 $arg_x;
            set_escape_uri $escaped $arg_x;
            return 200 "$sha $md5 $escaped";
        }

        location = /subs {
            proxy_pass http://backend/subs;
            subs_filter_types text/plain;
            subs_filter foo bar;
        }

        location = /compress {
            gzip off;
            brotli on;
            brotli_types text/plain;
            zstd on;
            zstd_types text/plain;
            proxy_pass http://backend/body;
        }

        location = /backend_count {
            proxy_pass http://backend/count;
        }

        location = /memc_store {
            internal;
            set $memc_key $query_string;
            set $memc_exptime 60;
            memc_pass memc;
        }

        location = /srcache {
            set $key $uri;
            srcache_fetch GET /memc_store $key;
            srcache_store PUT /memc_store $key;
            srcache_store_statuses 200;
            proxy_pass http://backend/cache;
        }

        location = /memc {
            set $memc_key $arg_key;
            memc_pass memc;
        }

        location = /memc_set {
            set $memc_cmd set;
            set $memc_key $arg_key;
            set $memc_value $arg_value;
            set $memc_exptime 60;
            memc_pass memc;
        }

        location = /redis2/set {
            redis2_query set $arg_key $arg_value;
            redis2_pass redis;
        }

        location = /redis2/get {
            redis2_query get $arg_key;
            redis2_pass redis;
        }

        location = /pg {
            postgres_pass pg;
            postgres_query "SELECT 42 AS answer, 'ok' AS status";
        }

        location = /rds {
            postgres_pass pg;
            postgres_query "SELECT 1 AS id, 'alice' AS name";
            rds_json on;
        }
    }
}
