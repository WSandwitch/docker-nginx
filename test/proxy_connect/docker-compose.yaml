version: "3"

services:
  nginx:
    image: ${DOCKER_IMAGE:-wsandwitch/nginx-extra:latest}
    ports:
    - "3128:3128"
    volumes:
    - ./nginx.conf:/etc/nginx/nginx.conf
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3128"]
      interval: 2s
      timeout: 2s
      retries: 30
  test:
    build: .
    command: npm test
    environment:
      PROXY_HOST: nginx
      PROXY_PORT: 3128
    depends_on:
      nginx:
        condition: service_healthy
