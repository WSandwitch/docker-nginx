version: "3"

services:
  nginx:
    image: ${DOCKER_IMAGE:-wsandwitch/nginx-extra:latest}
    ports:
    - "8000:8000"
    volumes:
    - ./nginx.conf:/etc/nginx/nginx.conf
    networks:
      nginx:
        ipv4_address: 172.16.252.10
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8000/status"]
      interval: 2s
      timeout: 2s
      retries: 30
  test:
    build: .
    command: npm test
    environment:
      NGINX_URL: http://172.16.252.10:8000
    ports:
    - "8080:8080"
    networks:
      nginx:
        ipv4_address: 172.16.252.99
    depends_on:
      nginx:
        condition: service_healthy

networks:
  nginx:
    ipam:
      driver: default
      config:
      - subnet: "172.16.252.0/24"
