user nginx;
worker_processes 1;

error_log /dev/stderr info;
pid /tmp/nginx.pid;

load_module modules/ngx_stream_upsync_module.so;

events {
    worker_connections 256;
}

stream {
    upstream dynamic {
        upsync consul:8500/v1/kv/upstreams/test/ upsync_timeout=6m upsync_interval=500ms upsync_type=consul strong_dependency=off;
        upsync_dump_path /tmp/upsync/upstream.conf;
        include /tmp/upsync/upstream.conf;
    }

    server {
        listen 9003;
        proxy_connect_timeout 2s;
        proxy_timeout 5s;
        proxy_pass dynamic;
    }
}
