version: "3"

services:
  nginx:
    image: ${DOCKER_IMAGE:-wsandwitch/nginx-extra:latest}
    ports:
    - "8000:8000"
    volumes:
    - ./nginx.conf:/etc/nginx/nginx.conf
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8000/test1"]
      interval: 2s
      timeout: 2s
      retries: 30
  test:
    build: .
    command: npm test
    environment:
      NGINX_URL: http://nginx:8000
    depends_on:
      nginx:
        condition: service_healthy
