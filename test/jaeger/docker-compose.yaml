version: "3"

services:
  nginx:
    image: ${DOCKER_IMAGE:-wsandwitch/nginx-extra:latest}
    ports:
    - "8000:8000"
    volumes:
    - ./nginx.conf:/etc/nginx/nginx.conf
    - ./jaeger-config.yaml:/etc/nginx/jaeger-config.yaml
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8000"]
      interval: 2s
      timeout: 2s
      retries: 30
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      SPAN_STORAGE_TYPE: memory
    ports:
    - "6831:6831/udp"
    - "6832:6832/udp"
    - "5778:5778"
    - "14268:14268"
    - "14250:14250"
    - "16686:16686"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:16686/api/services"]
      interval: 2s
      timeout: 2s
      retries: 30
  test:
    build: .
    command: npm test
    environment:
      NGINX_URL: http://nginx:8000
      JAEGER_URL: http://jaeger:16686
    depends_on:
      nginx:
        condition: service_healthy
      jaeger:
        condition: service_healthy
